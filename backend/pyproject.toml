[project]
name = "profound-demo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "content-optimization-exploration==0.1.1",
    "openai>=2,<3",
    "tiktoken>=0.12,<1",
]
[tool.uv.sources]
content-optimization-exploration = { path = "packages/content_optimization_exploration-0.1.1-py3-none-any.whl" }
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
